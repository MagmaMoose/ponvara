# SecurityBridge — Phase 0 scaffold.
#
# This is a *seed* project file. The package under `src/securitybridge/` is an
# empty, version 0.0.0 shell (no working code yet). The dependency list, scripts
# entry, and tooling config below describe the *intended* runtime shape from
# docs/DESIGN.md so later phases have a real base to build against — they do not
# imply the service exists yet. See "Status: Planning (Phase 0)" in README.md.
[project]
name = "securitybridge"
version = "0.0.0"
description = "Finding bus: pluggable source connectors -> DefectDojo reimport + zero-touch GitHub-issue auto-push."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Caleb Sargeant", email = "caleb@magmamoose.com" }]
keywords = [
  "security",
  "defectdojo",
  "dependency-track",
  "sonarqube",
  "sarif",
  "finding-bus",
  "vulnerability-management",
]
# Intended runtime deps for the long-lived service (Phases 1-4). The Django ORM
# coupling of the legacy CronJob is deliberately absent: DefectDojo is reached
# over its REST API via httpx, which is the whole point (slim image,
# version-decoupled). See docs/DESIGN.md sect. 4.
dependencies = [
  "httpx",
  "pydantic-settings",
  "apscheduler",
  "fastapi",
  "uvicorn[standard]",
  "PyGithub",
  "prometheus-client",
]

[project.scripts]
securitybridge = "securitybridge.__main__:main"

[project.urls]
Homepage = "https://github.com/MagmaMoose/securitybridge"
Source = "https://github.com/MagmaMoose/securitybridge"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/securitybridge"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
