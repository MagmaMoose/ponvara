# ponvara — Phase 1: REST Dependency-Track → DefectDojo sync.
#
# Deliberately slim: the legacy CronJob ran inside the heavy defectdojo-django
# image to use the Django ORM. This reaches DefectDojo over its REST API via httpx
# instead, so it runs on python:3.12-slim, decoupled from DefectDojo's version.
# The long-lived service (FastAPI + APScheduler + Prometheus) and the GitHub-issue
# push (PyGithub) return as deps in later phases; see docs/DESIGN.md.
[project]
name = "ponvara"
version = "0.1.0"
description = "Finding bus: Dependency-Track → DefectDojo sync over the REST API (no Django ORM)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Caleb Sargeant", email = "caleb@magmamoose.com" }]
keywords = ["security", "defectdojo", "dependency-track", "finding-bus", "vulnerability-management"]
dependencies = ["httpx", "pydantic-settings"]

[project.scripts]
ponvara = "ponvara.__main__:main"

[project.urls]
Homepage = "https://github.com/MagmaMoose/ponvara"
Source = "https://github.com/MagmaMoose/ponvara"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ponvara"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
