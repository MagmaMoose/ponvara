# =============================================================================
# securitybridge — Helm values (Phase 1: REST Dependency-Track → DefectDojo sync)
#
# One hourly CronJob runs `securitybridge sync`: it reimports every Dependency-Track
# project's findings into DefectDojo over the REST API (no Django ORM). Reads the
# DT API key + a PROVISIONED DefectDojo API token from a Secret that External
# Secrets Operator materialises from OCI Vault. Writes nothing to disk (read-only
# root fs). The long-lived service + GitHub-issue push are later phases.
# =============================================================================

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/magmamoose/securitybridge
  tag: "" # defaults to Chart.appVersion; a Flux ImagePolicy can bump it
  pullPolicy: IfNotPresent

schedule: "0 * * * *" # hourly (matches the legacy CronJob; reimport dedups)
concurrencyPolicy: Forbid
backoffLimit: 1
activeDeadlineSeconds: 1800

dependencyTrack:
  url: http://dependency-track-api-server.security.svc.cluster.local:8080

defectDojo:
  url: http://defectdojo-django.security.svc.cluster.local
  productType: "Dependency-Track"
  engagement: "Dependency Track"

# ESO → OCI Vault. Reuse the existing DT key; Phase 1 adds ONE new key: a
# provisioned DefectDojo service-user API token (replaces the old ORM token-mint).
externalSecrets:
  enabled: true
  store: oci-vault
  storeKind: ClusterSecretStore
  refreshInterval: "1h"
  dtrackApiKeyRef: dependency-track-api-key # existing OCI Vault key → DTRACK_API_KEY
  defectDojoTokenRef: securitybridge-dd-token # NEW OCI Vault key → DEFECTDOJO_TOKEN

# House convention: worker node, CPU request only (no CPU limit), memory limited.
nodeSelector:
  node-role.kubernetes.io/worker: ""

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

# Hardening — mirrors the tightened SonarQube sync CronJob.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
