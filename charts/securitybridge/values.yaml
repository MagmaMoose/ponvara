# SecurityBridge Helm values — PHASE 0 STUB.
#
# This is a values *sketch* from docs/DESIGN.md, not a working configuration.
# There are no chart templates yet (charts/securitybridge/templates/ is empty),
# no published image, and nothing here is wired to Flux. It exists so the intended
# deployment shape is reviewable and the keys are stable for later phases. Do not
# `helm install` this expecting a running service.
#
# Target platform (mirrors the MagmaMoose/chargate broker deploy pattern): a k3s
# cluster reconciled by FluxCD, secrets via External Secrets Operator backed by
# OCI Vault, external exposure (if any) via a cloudflared tunnel.

# Container image. Tag is left empty so Flux's ImagePolicy fills it on each GHCR
# release (Phase 3+). No image is published yet.
image:
  repository: ghcr.io/magmamoose/securitybridge
  tag: ""
  pullPolicy: IfNotPresent

# Runtime shape. "deployment" == long-lived FastAPI + APScheduler service (the
# recommended target). "cronjob" == retain batch semantics but from our own slim
# image. The chart is intended to support both so the choice stays reversible.
mode: deployment

replicaCount: 1
# Single-writer service; recreate rather than roll to avoid two schedulers racing.
strategy:
  type: Recreate

# Per-source schedules. Cron strings for mode=cronjob; APScheduler intervals for
# mode=deployment. Mirrors the legacy CronJobs' hourly / +30m offset.
schedule:
  dependencyTrack: "0 * * * *"
  sonarqube: "30 * * * *"

# DefectDojo sink — reached over the REST API (NOT the Django ORM). In-cluster
# service DNS, no Cloudflare round-trip.
defectDojo:
  url: http://defectdojo-django.security.svc.cluster.local
  productType: Dependency-Track

# Source connectors. Each is independently toggleable so a new source is a new
# connector + a new block here.
sources:
  dependencyTrack:
    enabled: true
    url: http://dependency-track-api-server.security.svc.cluster.local:8080
  sonarqube:
    enabled: true
    url: https://sonarqube.magmamoose.com

# Zero-touch GitHub-issue auto-push (the cross-cutting enrichment DefectDojo can't
# do generically). Only findings at/above minSeverity open issues.
github:
  minSeverity: High
  maxIssuesPerRun: 50

# External Secrets Operator -> OCI Vault. Reuse the existing keys; Phase 1 adds
# one new key (securitybridge-dd-token) for the dedicated DefectDojo service user.
externalSecrets:
  store: oci-vault
  keys:
    dtrackApiKey: dependency-track-api-key
    ddApiToken: securitybridge-dd-token   # NEW — dedicated DD service-user token (Phase 1)
    githubTargets: github-issue-targets
    sonarToken: defectdojo-api-key

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

# Prometheus ServiceMonitor for the /metrics endpoint (mode=deployment).
serviceMonitor:
  enabled: true

# External exposure of the trigger API (POST /sync/{source}) is off by default;
# wire a cloudflared tunnel if it's ever needed. Not an in-cluster Ingress.
ingress:
  enabled: false

# Heavy app pods live on the worker node (house convention, mirrors the CronJob).
nodeSelector:
  node-role.kubernetes.io/worker: ""

# Hardening — mirror the tightened SonarQube CronJob: non-root high UID, read-only
# root fs, seccomp RuntimeDefault, drop all caps.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# It never calls the Kubernetes API, so don't mount a token.
serviceAccount:
  create: true
  automountServiceAccountToken: false
