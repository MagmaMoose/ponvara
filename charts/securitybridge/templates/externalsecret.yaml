# kics-scan ignore
{{- if .Values.externalSecrets.enabled }}
# Pulls the Dependency-Track API key + a provisioned DefectDojo API token from OCI
# Vault (via External Secrets Operator) into one Secret the CronJob consumes.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "securitybridge.fullname" . }}
  labels: {{- include "securitybridge.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.store }}
    kind: {{ .Values.externalSecrets.storeKind }}
  target:
    name: {{ include "securitybridge.fullname" . }}
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: DTRACK_API_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.dtrackApiKeyRef }}
    - secretKey: DEFECTDOJO_TOKEN
      remoteRef:
        key: {{ .Values.externalSecrets.defectDojoTokenRef }}
    {{- if .Values.github.enabled }}
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: {{ .Values.externalSecrets.githubTokenRef }}
    {{- end }}
{{- end }}
